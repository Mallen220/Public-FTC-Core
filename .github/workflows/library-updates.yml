name: Library updates

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: library-updates

env:
  BRANCH: bot/library-updates

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Look for new releases on Maven
        id: check
        run: node scripts/library-updates.mjs --write --summary "$RUNNER_TEMP/pull-request.md"
      # Pull requests opened with the workflow token don't trigger check.yml, so validate here.
      - name: Rebuild and validate the catalog
        if: steps.check.outputs.count != '0'
        run: npm run build
      - name: Open or update the pull request
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          if gh pr list --head "$BRANCH" --state closed --json title,mergedAt \
              --jq '.[] | select(.mergedAt == null) | .title' | grep -Fxq "$TITLE"; then
            echo "\"$TITLE\" was closed without merging; not proposing it again."
            exit 0
          fi
          if git fetch --quiet origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null && git diff --quiet "origin/$BRANCH" -- catalog; then
            echo "The pull request branch already has these releases."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add catalog
          git commit --quiet --message "$TITLE"
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pull-request.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pull-request.md"
          fi
